<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>MESSA TEAMS – Team Collaboration by MESSA SQUARE</title>
    <meta name="description" content="MESSA TEAMS – Real-time chat, task management, and video meetings for MESSA SQUARE teams." />
    <meta name="theme-color" content="#D72A2A" />
    <meta name="color-scheme" content="dark" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <link rel="apple-touch-icon" href="/src/assets/logo.png" />

    <!-- PWA / Mobile -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MESSA TEAMS" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph -->
    <meta property="og:title" content="MESSA TEAMS" />
    <meta property="og:description" content="Team collaboration platform by MESSA SQUARE" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/src/assets/logo.png" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Prevent flash of unstyled content -->
    <style>
      html, body {
        background: #0a0a0a;
        color: #ffffff;
        margin: 0;
        padding: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #root {
        min-height: 100vh;
      }
      /* Initial loader before React mounts */
      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        gap: 1.5rem;
        z-index: 9999;
      }
      .initial-loader-logo {
        width: 64px;
        height: 64px;
        border-radius: 12px;
        background: linear-gradient(135deg, #D72A2A, #B71C1C);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 28px;
        font-weight: 800;
        animation: pulse 1.5s ease-in-out infinite;
      }
      .initial-loader-text {
        font-size: 14px;
        font-weight: 600;
        color: #a0a0a0;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.8; }
      }
      /* Hide loader once React mounts */
      #root:not(:empty) + .initial-loader {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div class="initial-loader">
      <div class="initial-loader-logo">M</div>
      <div class="initial-loader-text">MESSA TEAMS</div>
    </div>

    <noscript>
      <div style="padding: 2rem; text-align: center; color: #fff;">
        <h1>JavaScript Required</h1>
        <p>MESSA TEAMS requires JavaScript to run. Please enable it in your browser.</p>
      </div>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
